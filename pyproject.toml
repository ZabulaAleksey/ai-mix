[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-mix-assistant"
version = "0.1.0"
description = "Local foundation for the AI Mix Assistant"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AI Mix Assistant contributors" }]
dependencies = []

[project.scripts]
ai-mix = "ai_mix_assistant.adapters.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_mix_assistant"]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
tmp_path_retention_policy = "none"
tmp_path_retention_count = 0

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
